name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Test, GitHub Release & npm Publish with Provenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Verify JavaScript Syntax
        run: npm run check

      - name: Build Universal Bundles (Full & Lite)
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Flash Page ${{ github.ref_name }}
          files: |
            flashpage.js
            flashpage.min.js
            flashpage.lite.js
            flashpage.lite.min.js
            flashpage.d.ts
            flashpage.lite.d.ts
            LICENSE
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
